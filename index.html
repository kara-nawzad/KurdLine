<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KurdLine</title>
<style>
:root{
  --sky-a:#e9e4ef;--sky-b:#cfc6dc;--ink:#2a2540;--muted:#5d5675;
  --pill:rgba(255,255,255,.75);--m1:#b3a8c6;--m2:#9285ab;--m3:#6f6389;--sig:#1f7f8a;--tea:#a8431f;--star:transparent;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-a:#0f1226;--sky-b:#2a2750;--ink:#f1ecf7;--muted:#a9a3c4;
    --pill:rgba(12,14,34,.72);--m1:#2f2c58;--m2:#232148;--m3:#171634;--sig:#6fe0e6;--tea:#e0733f;--star:#fff;
  }
}
:root[data-theme="dark"]{
  --sky-a:#0f1226;--sky-b:#2a2750;--ink:#f1ecf7;--muted:#a9a3c4;
  --pill:rgba(12,14,34,.72);--m1:#2f2c58;--m2:#232148;--m3:#171634;--sig:#6fe0e6;--tea:#e0733f;--star:#fff;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b));
  color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
.stars{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.stars circle{fill:var(--star);animation:tw 4s ease-in-out infinite}
.stars circle:nth-child(3n){animation-delay:1.3s}.stars circle:nth-child(3n+1){animation-delay:2.6s}
@keyframes tw{50%{opacity:.25}}
.ridge{position:absolute;left:0;bottom:0;width:100%;height:38%}
.waves{position:absolute;left:0;width:100%;bottom:24%;height:90px;overflow:hidden;pointer-events:none}
.waves svg{position:absolute;left:0;top:0;width:200%;height:100%;animation:drift 22s linear infinite}
.waves svg:nth-child(2){animation-duration:34s;animation-direction:reverse;opacity:.55;top:14px}
.waves svg:nth-child(3){animation-duration:48s;opacity:.3;top:28px}
@keyframes drift{to{transform:translateX(-50%)}}
.waves path{fill:none;stroke:var(--sig);stroke-width:2.5;stroke-linecap:round}
main{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:clamp(40px,11vh,110px) 24px 0;text-align:center;
}
.glass{width:64px;height:auto;margin-bottom:10px}
.steam path{fill:none;stroke:var(--sig);stroke-width:2.5;stroke-linecap:round;opacity:0;animation:rise 3.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.2s}.steam path:nth-child(3){animation-delay:2.4s}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
h1{margin:0;font-weight:800;font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--sig)}
.big{margin:18px 0 0;font-weight:800;font-size:clamp(1.25rem,5vw,1.7rem)}
.msg{margin:10px 0 0;max-width:30ch;font-size:clamp(1.05rem,4vw,1.25rem);line-height:1.5;color:var(--ink)}
.small{margin:18px 0 0;max-width:34ch;font-size:.95rem;line-height:1.5;color:var(--ink);background:var(--pill);padding:10px 18px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative;z-index:3}
@media (max-height:720px){main{padding-top:28px}.glass{width:48px}.big{margin-top:10px}}
@media (max-width:480px){.small{border-radius:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam path{opacity:.6}}
</style>
</head>
<body>
<svg class="stars" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 60">
  <circle cx="8" cy="8" r=".25"/><circle cx="22" cy="18" r=".2"/><circle cx="37" cy="6" r=".25"/>
  <circle cx="52" cy="14" r=".2"/><circle cx="68" cy="5" r=".25"/><circle cx="82" cy="16" r=".2"/>
  <circle cx="93" cy="7" r=".25"/><circle cx="14" cy="27" r=".2"/><circle cx="76" cy="26" r=".2"/>
</svg>

<div class="waves" aria-hidden="true">
  <svg viewBox="0 0 1600 40" preserveAspectRatio="none"><path class="w"/></svg>
  <svg viewBox="0 0 1600 40" preserveAspectRatio="none"><path class="w"/></svg>
  <svg viewBox="0 0 1600 40" preserveAspectRatio="none"><path class="w"/></svg>
</div>

<svg class="ridge" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 400V190l90-60 70 40 110-110 80 80 90-60 100 90 110-120 90 100 80-50 120 110 90-60 120 70 60-30v300z" fill="var(--m1)"/>
  <path d="M0 400V260l120-70 90 60 120-90 100 80 130-80 110 90 120-80 100 70 110-60 100 70v210z" fill="var(--m2)"/>
  <path d="M0 400V330l140-60 120 50 150-60 140 60 150-50 140 50 140-40 120 40v130z" fill="var(--m3)"/>
</svg>

<main>
  <svg class="glass" viewBox="0 0 64 70" role="img" aria-label="Glass of Kurdish black tea">
    <g class="steam"><path d="M22 20q-6-8 0-16"/><path d="M32 20q-6-8 0-16"/><path d="M42 20q-6-8 0-16"/></g>
    <path d="M14 26h36q-2 22-10 30H24q-8-8-10-30z" fill="var(--tea)"/>
    <path d="M14 26h36" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="32" cy="60" rx="22" ry="5" fill="var(--ink)" opacity=".8"/>
  </svg>
  <h1>Kurd<em>Line</em></h1>
  <p class="big">We’re 4,500+ lines in.</p>
  <p class="msg">The waves are resting on the Zagros mountains, having a nice cup of Kurdish black tea.</p>
  <p class="small">Fiber, microwave, satellite and 5G are on a short break. Back soon.</p>
</main>

<script>
  // sine signal: 8 periods across 1600 units, tiles at 50% for a seamless drift
  var d="M0 20q50 -14 100 0"+"t100 0".repeat(15);
  document.querySelectorAll(".w").forEach(function(p){p.setAttribute("d",d)});
</script>
</body>
</html>
